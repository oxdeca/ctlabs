---

# ------------------------------------------------------------------------------
# File        : ctlabs/labs/setup_profiles.yml
# Description : reusable default fact config per role
#               profile name is independent of role name
#               lab.rb merges these with play.setup overrides
# ------------------------------------------------------------------------------

profiles:

  # ----------------------------------------------------------------------------
  # ctlabs_vault
  # ----------------------------------------------------------------------------
  vault:
    role: vault
    defaults:
      install_type: server
    
  # ----------------------------------------------------------------------------
  # ctlabs_bind
  # ----------------------------------------------------------------------------
  bind:
    role: bind
    ns1:
      type  : master
      zones :
        - name: ctlabs.internal
        - name: svc.ctlabs.internal
          ddns:
            allow: [127.0.0.1]
        - name: ad.ctlabs.internal
          type: forward
          forwarders: [192.168.10.14]
      slaves: [192.168.20.11]
    ns2:
      type   : slave
      zones  :
        - name: ctlabs.internal
        - name: svc.ctlabs.internal
        - name: ad.ctlabs.internal
          type: forward
          forwarders: [192.168.10.14]
      masters: [192.168.10.11]

  # ----------------------------------------------------------------------------
  # ctlabs_smbadc
  # ----------------------------------------------------------------------------
  smbadc:
    role: smbadc
    dc1:
      role  : master
      domain: "ad.ctlabs.internal"
    dc2:
      role  : slave
      domain: "ad.ctlabs.internal"
      master: "dc1.ad.ctlabs.internal"

  # ----------------------------------------------------------------------------
  # ctlabs_slapd
  # ----------------------------------------------------------------------------
  slapd:
    role: slapd
    slapd1:
      dbs:
        - type       : ldap
          suffix     : "dc=ad,dc=ctlabs,dc=internal"
          uri        : "ldaps://dc2.ctlabs.internal ldaps://dc1.ctlabs.internal"
          bind_method: simple
          bind_user  : "cn=slapd,ou=services,dc=ad,dc=ctlabs,dc=internal"
          bind_pass  : "secret123!"
    slapd2:
      dbs:
        - type       : ldap
          suffix     : "dc=ad,dc=ctlabs,dc=internal"
          uri        : "ldaps://dc2.ctlabs.internal ldaps://dc1.ctlabs.internal"
          bind_method: simple
          bind_user  : "cn=slapd,ou=services,dc=ad,dc=ctlabs,dc=internal"
          bind_pass  : "secret123!"

  # ----------------------------------------------------------------------------
  # ctlabs_sssd
  # ----------------------------------------------------------------------------
  sssd:
    role: sssd
    defaults:
      backend : ldap
      domain  : ad.ctlabs.internal
      uri     : "ldap://slapd1.ctlabs.internal, ldap://slapd2.ctlabs.internal"
      base    : "dc=ad,dc=ctlabs,dc=internal"

  # ----------------------------------------------------------------------------
  # ctlabs_alloy
  # ----------------------------------------------------------------------------
  alloy:
    role: alloy
    defaults:
      loki:
        url: "https://loki.ctlabs.internal:3100/loki/api/v1/push"
      mtls: true

  # ----------------------------------------------------------------------------
  # ctlabs_node_exporter
  # ----------------------------------------------------------------------------
  node_exporter:
    role: node_exporter
    defaults:
      mtls: true

  # ----------------------------------------------------------------------------
  # ctlabs_blackbox_exporter
  # ----------------------------------------------------------------------------
  blackbox_exporter:
    role: blackbox_exporter
    defaults:
      mtls: true

  # ----------------------------------------------------------------------------
  # ctlabs_promtail
  # ----------------------------------------------------------------------------
  promtail:
    role: promtail

  # ----------------------------------------------------------------------------
  # ctlabs_prometheus
  # ----------------------------------------------------------------------------
  prometheus:
    role: prometheus
    defaults:
      mode  : agent
      config:
        node_exporter    : true
        blackbox_exporter: true
        goflow2          : true
        remote_write:
          uri: "https://mimir.ctlabs.internal:9009/api/v1/push"

  # ----------------------------------------------------------------------------
  # ctlabs_openvpn
  # ----------------------------------------------------------------------------
  openvpn:
    role: openvpn
    ro1:
      type     : server
      server_ip: "10.8.15.1"
      client_ip: "10.8.15.2"
    ro2:
      type     : client
      server_ip: "10.8.15.1"
      client_ip: "10.8.15.2"
      remote   : "192.168.16.2"

  # ----------------------------------------------------------------------------
  # ctlabs_frr
  # ----------------------------------------------------------------------------
  frr:
    role: frr

  # ----------------------------------------------------------------------------
  # ctlabs_rundeck
  # ----------------------------------------------------------------------------
  rundeck:
    role: rundeck
    ansible:
      server_url   : "https://{{ CTLABS_HOST }}:8192"
      auth_provider: ad
    rdk1:
      server_url   : "https://{{ CTLABS_HOST }}:8091"
      auth_provider: ad
    rdk2:
      server_url   : "https://{{ CTLABS_HOST }}:8092"
      auth_provider: ad

  # ----------------------------------------------------------------------------
  # ctlabs_kafka
  # ----------------------------------------------------------------------------
  kafka:
    role: kafka
    kafka1: &kafka_default
      server_address: "kafka1.ctlabs.internal:9092"
      auth_method   : SASL_PLAINTEXT
    kafka2:
      server_address: "kafka2.ctlabs.internal:9092"
      auth_method   : SASL_PLAINTEXT

  # ----------------------------------------------------------------------------
  # ctlabs_k3s
  # ----------------------------------------------------------------------------
  k3s:
    role: k3s
    k3s1:
      role: server
      ingress:
        enabled : false
      gateway_api:
        enabled : true
        provider: traefik
    k3s2:
      role       : control
      server_node: k3s1
      server_url : "https://k3s1.ctlabs.internal:6443"
      ingress:
        enabled : false
      gateway_api:
        enabled : false
    k3s3:
      role       : control
      server_node: k3s1
      server_url : "https://k3s1.ctlabs.internal:6443"
      ingress:
        enabled : false
      gateway_api:
        enabled : false
    k3s4:
      role       : worker
      server_node: k3s1
      server_url : "https://k3s1.ctlabs.internal:6443"
      ingress:
        enabled : false
      gateway_api:
        enabled : false

  # ----------------------------------------------------------------------------
  # ctlabs_rke2
  # ----------------------------------------------------------------------------
  rke2:
    role: rke2
    rke21:
      role       : server
      ingress:
        enabled : false
        type    : nginx
      gateway_api:
        enabled : true
        provider: traefik
    rke22:
      role       : control
      server_node: rke21
      server_url : "https://rke21.ctlabs.internal:9345"
      ingress:
        enabled : false
      gateway_api:
        enabled : false
    rke23:
      role       : control
      server_node: rke21
      server_url : "https://rke21.ctlabs.internal:9345"
      ingress:
        enabled : false
      gateway_api:
        enabled : false
    rke24:
      role       : worker
      server_node: rke21
      server_url : "https://rke21.ctlabs.internal:9345"
      ingress:
        enabled : false
      gateway_api:
        enabled : false

  # ----------------------------------------------------------------------------
  # ctlabs_kind
  # ----------------------------------------------------------------------------
  kind:
    role: kind
    kind1:
      plane  : single
      ingress:
        enabled : false
        type    : nginx
      gateway_api:
        enabled : true
        provider: traefik

  # ----------------------------------------------------------------------------
  # ctlabs_helm
  # ----------------------------------------------------------------------------
  helm:
    role: helm
    defaults:
      repos:
        - name    : argo
          repo_url: https://argoproj.github.io/argo-helm
        - name    : traefik
          repo_url: https://traefik.github.io/charts
    k3s1:
      charts:
        - name        : argocd
          chart       : argo/argo-cd
          namespace   : argo
          kubeconfig  : /etc/rancher/k3s/k3s.yaml
          interpreter : "/usr/sbin/ip vrf exec default /usr/bin/python3"
          wait        : true
          atomic      : true
          gateway:
            name        : traefik-gateway
            namespace   : kube-system
            refgrant_api: v1beta1
          values:
            global:
              domain: argocd.ctlabs.internal
            configs:
              secret:
                argocdServerAdminPassword: $2a$10$su0tAsqr1mOHxP4EoT7ExOZLSGw4C9GiG30GHaLVCA1ceW6CXl4r2
            server:
              ingress:
                enabled         : false
                ingressClassName: traefik
                hostname        : argocd.ctlabs.internal
    rke21:
      charts:
        - name          : traefik
          chart         : traefik/traefik
          chart_version : "40.0.0"
          namespace     : traefik
          skip_crds     : true
          update_repo_cache: true
          wait          : true
          values        :
            providers:
              kubernetesGateway:
                enabled: true
            deployment:
              hostNetwork: true
            ports:
              web:
                port    : 8000
                hostPort: 8000
              websecure:
                port    : 8443
                hostPort: 8443
            service:
              type: ClusterIP
        - name        : argocd
          chart       : argo/argo-cd
          namespace   : argo
          kubeconfig  : /etc/rancher/rke2/rke2.yaml
          interpreter : "/usr/sbin/ip vrf exec default /usr/bin/python3"
          wait        : true
          atomic      : true
          gateway:
            name        : traefik-gateway
            namespace   : traefik
            refgrant_api: v1
          values      :
            global:
              domain: argocd.ctlabs.internal
            configs:
              secret:
                argocdServerAdminPassword: $2a$10$su0tAsqr1mOHxP4EoT7ExOZLSGw4C9GiG30GHaLVCA1ceW6CXl4r2
              params:
                server.insecure: true
            server:
              ingress:
                enabled         : false
                ingressClassName: traefik
                hostname        : argocd.ctlabs.internal
    k8s1:
      charts:
        - name        : argocd
          chart       : argo/argo-cd
          namespace   : argo
          kubeconfig  : /etc/kubernetes/admin.conf
          interpreter : "/usr/sbin/ip vrf exec default /usr/bin/python3"
          wait        : true
          atomic      : true
          values      :
            global:
              domain: ""
            configs:
              secret:
                argocdServerAdminPassword: $2a$10$su0tAsqr1mOHxP4EoT7ExOZLSGw4C9GiG30GHaLVCA1ceW6CXl4r2
              params:
                server.insecure    : true
                server.basehref    : /argo
                server.rootpath    : /argo
            server:
              ingress:
                enabled         : true
                controller      : generic
                ingressClassName: nginx

  # ----------------------------------------------------------------------------
  # ctlabs_foreman
  # ----------------------------------------------------------------------------
  foreman:
    role: foreman
    fm1:
      role    : server
      scenario: katello
    fm2:
      role: proxy
    fm3:
      role: proxy
    fm4:
      role: proxy

  # ----------------------------------------------------------------------------
  # ctlabs_wazuh
  # ----------------------------------------------------------------------------
  wazuh:
    role: wazuh
    wazuh1:
      role: manager
    wazuh2:
      role       : agent
      server_addr: "wazuh1.ctlabs.internal"

  # ----------------------------------------------------------------------------
  # ctlabs_opendkim
  # ----------------------------------------------------------------------------
  opendkim:
    role: opendkim
    mail1:
      domain  : ctlabs.internal
      selector: mail
    mail2:
      domain  : ctlabs.internal
      selector: mail

  # ----------------------------------------------------------------------------
  # ctlabs_chrony
  # ----------------------------------------------------------------------------
  chrony:
    role: chrony
    h3:
      role   : server
      sources: [ntp1.torrix.ca, ntp2.torrix.ca, ntp3.torrix.ca]
      clients: [192.168.0.0/16]
    h4:
      role   : client
      sources: [h3.ctlabs.internal]

  # ----------------------------------------------------------------------------
  # ctlabs_claude_code
  # ----------------------------------------------------------------------------
  claude_anthropic:
    role: claude_code
    defaults:
      provider:
        active: anthropic

  claude_openrouter:
    role: claude_code
    defaults:
      provider:
        active: openrouter

  claude_vertexai:
    role: claude_code
    defaults:
      provider:
        active: vertexai
