---

# ------------------------------------------------------------------------------
# File        : ctlabs/labs/role_profiles.yml
# Description : maps role profile names to ansible roles and their canonical
#               host patterns. lab.rb uses this to generate ctlabs.yml.
#               hosts are filtered against nodes that actually exist in the lab.
# ------------------------------------------------------------------------------

profiles:

  ca:
    role : ctlabs_ca
    tags : [ca]
    hosts: all

  semaphore_ui:
    role : ctlabs_semaphore_ui
    tags : [semaphore_ui]
    hosts: [ansible]

  openbao:
    role : ctlabs_openbao
    tags : [openbao]
    hosts: [vdb1, vdb2]

  vault:
    role : ctlabs_vault
    tags : [vault]
    hosts: [vdb1, vdb2]

  rundeck:
    role : ctlabs_rundeck
    tags : [rundeck]
    hosts: [ansible]

  kafka:
    role : ctlabs_kafka
    tags : [kafka]
    hosts: [kafka1, kafka2]

  openvpn:
    role : ctlabs_openvpn
    tags : [openvpn]
    hosts: [ro1, ro2]

  frr:
    role : ctlabs_frr
    tags : [frr]
    hosts: [ro1, ro2, ro3, ro4, isp1]

  bind:
    role : ctlabs_bind
    tags : [bind]
    hosts: [ns1, ns2]

  smbadc:
    role : ctlabs_smbadc
    tags : [smbadc]
    hosts:
      - group: [dc1]
        tags : [smbadc-master]
      - group: [dc2]
        tags : [smbadc-slave]

  slapd:
    role : ctlabs_slapd
    tags : [slapd]
    hosts: [slapd1, slapd2]

  sssd:
    role : ctlabs_sssd
    tags : [sssd]
    hosts: hosts

  haproxy:
    role : ctlabs_haproxy
    tags : [haproxy]
    hosts: [slapd1, slapd2]

  httpd:
    role : ctlabs_httpd
    tags : [httpd]
    hosts: [www1, www2, nb1, nb2, gua1, gua2]

  nginx:
    role : ctlabs_nginx
    tags : [nginx]
    hosts: [www1, www2, nb1, nb2, gua1, gua2, h3, h4]

  php:
    role : ctlabs_php
    tags : [php]
    hosts: [www1, www2, nb1, nb2, gua1, gua2, h3, h4]

  guacamole:
