---

# -----------------------------------------------------------------------------
# File        : ctlabs/labs/sys/srv03.yml
# Description : AD-DC Lab configuration
# -----------------------------------------------------------------------------

name: srv03
desc: LAB SRV AD-DC

topology:
- hv: lvm-vm1
  dns:
  - 192.168.10.11
  - 192.168.20.11
  - 8.8.8.8
  planes:
    mgmt:
      vrfid: 99
      dns:
      - 1.1.1.1
      - 8.8.8.8
      net: 192.168.99.0/24
      gw: 192.168.99.1
      nodes:
        ansible:
          type: controller
          gw: 192.168.99.1
          nics:
            eth0: 192.168.99.5/24
          vols: ["/root/ctlabs-ansible/:/root/ctlabs-ansible/:Z,rw", "/root/ctlabs-terraform/:/root/ctlabs-terraform/:Z,rw"]
          play:
            book: ctlabs.yml
            tags: [up, setup, ca, vault, bind, httpd, guacamole]
            setup:
              guacamole:
                hosts: [gua1]
                users:
                  - username: ctlabs
                    password: secret123!
                    connections:
                      - name: dc1-vnc
                        protocol: vnc
                        params:
                          hostname    : 192.168.10.114
                          port        : 5900
                          ignore-cert : true
                          color-depth : 24
                          width       : 1920
                          height      : 1200
                      - name: dc1-rdp
                        protocol: rdp
                        params:
                          hostname    : 192.168.10.14
                          port        : 3389
                          ignore-cert : true
                          color-depth : 24
                          width       : 1920
                          height      : 1200
                      - name: dc2-vnc
                        protocol: vnc
                        params:
                          hostname    : 192.168.20.114
                          port        : 5900
                          ignore-cert : true
                          color-depth : 24
                          width       : 1920
                          height      : 1200
                      - name: dc2-rdp
                        protocol: rdp
                        params:
                          hostname    : 192.168.20.14
                          port        : 3389
                          ignore-cert : true
                          color-depth : 24
                          width       : 1920
                          height      : 1200
          dnat:
          - [ 9988, 8200 ]
        sw0:
          profile: ovs
          type: switch
          ipv4: 192.168.99.10/24
          gw: 192.168.99.1
        ro0:
          profile: frr
          type: router
          gw: 192.168.15.1
          nics:
            eth0: 192.168.99.1/24
            eth1: 192.168.15.2/29
    edge:
      nodes:
        natgw:
          type: gateway
          ipv4: 192.168.15.1/29
          snat: true
          dnat:
            data: ro1:eth1
            mgmt: ro0:eth1
    transit:
      nodes:
        sw1:
          profile: ovs
          type: switch
        sw2:
          profile: ovs
          type: switch
        sw3:
          profile: ovs
          type: switch
          ports: 8
        ro1:
          profile: frr
          type: router
          gw: 192.168.15.1
          nics:
            eth1: 192.168.15.3/29
            eth2: 192.168.10.1/24
            eth3: 192.168.20.1/24
            eth4: 192.168.30.1/24
    data:
      nodes:
        ns1:
          type: host
          gw: 192.168.10.1
          nics:
            eth1: 192.168.10.11/24
        ns2:
          profile: d12
          type: host
          gw: 192.168.20.1
          nics:
            eth1: 192.168.20.11/24
        h1:
          profile: kali
          type: host
          gw: 192.168.10.1
          nics:
            eth1: 192.168.10.12/24
        h2:
          profile: parrot
          type: host
          gw: 192.168.20.1
          nics:
            eth1: 192.168.20.12/24
        gua1:
          type: host
          gw: 192.168.30.1
          nics:
            eth1: 192.168.30.17/24
          dnat:
          - [ 8081, 443 ]
        dc1:
          profile: qemu/win22/dtop
          type: host
          kvm: true
          gw: 192.168.10.1
          nics:
            eth1: 192.168.10.14/24
            eth2: 192.168.10.114/24
          plane: data
          provider: local
        dc2:
          profile: qemu/win22/core
          type: host
          gw: 192.168.20.1
          nics:
            eth1: 192.168.20.14/24
            eth2: 192.168.20.114/24
  links:
  - [ "ro0:eth1", "natgw:eth1" ]
  - [ "ro1:eth1", "natgw:eth2" ]
  - [ "ro1:eth2", "sw1:eth1" ]
  - [ "ro1:eth3", "sw2:eth1" ]
  - [ "ro1:eth4", "sw3:eth1" ]
  - [ "sw1:eth2", "ns1:eth1" ]
  - [ "sw1:eth3", "h1:eth1" ]
  - [ "sw1:eth4", "dc1:eth1" ]
  - [ "sw1:eth5", "dc1:eth2" ]
  - [ "sw2:eth2", "ns2:eth1" ]
  - [ "sw2:eth3", "h2:eth1" ]
  - [ "sw2:eth4", "dc2:eth1" ]
  - [ "sw2:eth5", "dc2:eth2" ]
  - [ "sw3:eth2", "gua1:eth1" ]
