---

# -----------------------------------------------------------------------------
# File        : ctlabs/labs/node_profiles.yml
# -----------------------------------------------------------------------------

profiles:
  controller:
    linux:
      image: ctlabs/c9/ctrl
      caps: [IPC_LOCK]
      vols: ['/root/ctlabs-ansible/:/root/ctlabs-ansible/:Z,rw', '/root/ctlabs-terraform/:/root/ctlabs-terraform/:Z,rw', '/root/ctlabs-ai/:/root/ctlabs-ai/:Z,rw']
  switch:
    ovs:
      image: ctlabs/c9/ovs
      ports: 4
      caps: [SYS_NICE, NET_BIND_SERVICE, IPC_LOCK, NET_BROADCAST]
    mgmt:
      image: ctlabs/c9/ovs
      ports: 14
      caps: [SYS_NICE, NET_BIND_SERVICE, IPC_LOCK, NET_BROADCAST]
    linux:
      image: ctlabs/c9/base
      ports: 8
    arista:
      image: ctlabs/misc/ceos
      ports: 5      
  host:
    linux:
      image: ctlabs/c9/base
    d12:
      image: ctlabs/d12/base
    kali:
      image: ctlabs/kali/base
    kali-ctf:
      image: ctlabs/kali/ctf
    parrot-ctf:
      image: ctlabs/parrot/ctf
    parrot:
      image: ctlabs/parrot/base
    vault:
      image: ctlabs/d12/base
      caps: [IPC_LOCK]
    slapd:
      image: ctlabs/d12/base
      caps: [SYS_PTRACE]
    qemu/d12:
      image: ctlabs/qemu/d12
      env: ['QEMU_MEM=2G', 'QEMU_CPU=4']
      kvm: true
      vols: ['/root/ctlabs-images/qemu-base/d12/:/mnt/qemu-base/:ro']
    qemu/c9:
      image: ctlabs/qemu/c9
      env: ['QEMU_MEM=2G', 'QEMU_CPU=4']
      kvm: true
      vols: ['/root/ctlabs-images/qemu-base/c9/:/mnt/qemu-base/:ro']
    qemu/win22/core:
      image: ctlabs/qemu/win22/core
      env: ['QEMU_MEM=4G', 'QEMU_CPU=4', 'QEMU_VNC=true']
      kvm: true
      os: windows
      vols: ['/root/ctlabs-images/qemu-base/win22-core/:/mnt/qemu-base/:ro']
    qemu/win22/dtop:
      image: ctlabs/qemu/win22/dtop
      env: ['QEMU_MEM=6G', 'QEMU_CPU=4', 'QEMU_VNC=true']
      kvm: true
      os: windows
      vols: ['/root/ctlabs-images/qemu-base/win22-dtop/:/mnt/qemu-base/:ro']
    qemu/win25/core:
      image: ctlabs/qemu/win25/core
      env: ['QEMU_MEM=4G', 'QEMU_CPU=4', 'QEMU_VNC=true']
      kvm: true
      os: windows
      vols: ['/root/ctlabs-images/qemu-base/win25-core/:/mnt/qemu-base/:ro']
    qemu/win25/dtop:
      image: ctlabs/qemu/win25/dtop
      env: ['QEMU_MEM=6G', 'QEMU_CPU=4', 'QEMU_VNC=true']
      kvm: true
      os: windows
      vols: ['/root/ctlabs-images/qemu-base/win25-dtop/:/mnt/qemu-base/:ro']
    db2:
      image: ctlabs/misc/db2
      caps: [SYS_NICE,IPC_LOCK,IPC_OWNER]
    cbeaver:
      image: ctlabs/misc/cbeaver
    juice:
      image: ctlabs/owasp/juice
    win:
      image: ctlabs/qemu/win
      os: windows
  router:
    frr:
      image: ctlabs/c9/frr
      caps: [SYS_NICE, NET_BIND_SERVICE]
      devs: ['/dev/net/tun']
    mgmt:
      image: ctlabs/c9/frr
      caps: [SYS_NICE, NET_BIND_SERVICE]
      devs: ['/dev/net/tun']
  gateway:
    remote:
      image: ctlabs/c9/base
