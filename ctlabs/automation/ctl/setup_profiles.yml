---

# ------------------------------------------------------------------------------
# File        : ctlabs/labs/setup_profiles.yml
# Description : reusable default fact config per role
#               profile name is independent of role name
#               lab.rb merges these with play.setup overrides
# ------------------------------------------------------------------------------

profiles:

  # ----------------------------------------------------------------------------
  # ctlabs_vault
  # ---------------------------------------------------------------------------- 
  vault:
    defaults:
      install_type: server

  # ----------------------------------------------------------------------------
  # ctlabs_claude
  # ----------------------------------------------------------------------------
  claude_anthropic:
    role: claude
    defaults:
      provider:
        active: anthropic

  claude_openrouter:
    role: claude
    defaults:
      provider:
        active: openrouter

  claude_vertexai:
    role: claude
    defaults:
      provider:
        active: vertexai
