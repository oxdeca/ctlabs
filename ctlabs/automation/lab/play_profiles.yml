---

# ------------------------------------------------------------------------------
# File        : ctlabs/automation/lab/play_profiles.yml
# Description : maps role profile names to ansible roles and their canonical
#               host patterns. lab.rb uses this to generate ctlabs.yml.
#               hosts are filtered against nodes that actually exist in the lab.
#               It also defines the execution order. 
# ------------------------------------------------------------------------------

profiles:

  # base must stay FIRST: the generator emits plays in file order, so this
  # makes ctlabs_base run before every other role (its facts play in setup.yml
  # and the role play in ctlabs.yml). hosts: hosts = run everywhere; the role
  # self-skips (precheck end_host) on unsupported OS/virtype.
  base:
    role : ctlabs_base
    hosts: hosts

  ca:
    role : ctlabs_ca
    hosts: all

  semaphore_ui:
    role : ctlabs_semaphore_ui
    hosts: [ansible]

  openbao:
    role : ctlabs_openbao
    hosts: [vdb1, vdb2]

  vault:
    role : ctlabs_vault
    hosts: [ansible]

  rundeck:
    role : ctlabs_rundeck
    hosts: [ansible,rdk1,rdk2]

  kafka:
    role : ctlabs_kafka
    hosts: [kafka1, kafka2]

  openvpn:
    role : ctlabs_openvpn
    hosts: [ro1, ro2]

  # Alternative tunnel technology to openvpn (one tunnel = one of the two, not
  # both). Same fact shape / same tun0-style purpose, different daemon:
  # wg0 + wg-quick instead of tun0 + openvpn@. A lab selects this instead of
  # `openvpn` in play.tags. `hosts` here is the pre-cloud default pair; a lab
  # that runs the tunnel to a cloud gateway overrides it per-lab via
  # play.setup.<profile>.hosts (see labs/cloud/cloud02.yml).
  wireguard:
    role : ctlabs_wireguard
    hosts: [ro1, ro2]

  frr:
    role : ctlabs_frr
    hosts: [ro1, ro2, ro3, ro4, isp1]

  bind:
    role : ctlabs_bind
    hosts: [ns1, ns2]

  smbadc-master:
    role : ctlabs_smbadc
    tags : [smbadc]
    hosts: [dc1]
    
  smbadc-slave:
    role : ctlabs_smbadc
    tags : [smbadc]
    hosts: [dc2]

  ad:
    role : ctlabs_ad
    hosts: [dc1]

  slapd:
    role : ctlabs_slapd
    hosts: [slapd1, slapd2]

  sssd:
    role : ctlabs_sssd
    hosts: hosts

  haproxy:
    role : ctlabs_haproxy
    hosts: [slapd1, slapd2]

  httpd:
    role : ctlabs_httpd
    hosts: [www1, www2, nb1, nb2, gua1, gua2]

  nginx:
    role : ctlabs_nginx
    hosts: [www1, www2, nb1, nb2, gua1, gua2, h3, h4]

  php:
    role : ctlabs_php
    hosts: [www1, www2, nb1, nb2, gua1, gua2, h3, h4]

  guacamole:
    role : ctlabs_guacamole
    hosts: [gua1, gua2]

  syslog:
    role : ctlabs_syslog
    hosts: [ns1]

  prometheus:
